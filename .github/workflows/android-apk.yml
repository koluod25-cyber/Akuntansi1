name: Build Anton Service POS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tools
        run: |
          node --version
          pnpm --version

            - name: Prepare dependencies
         run: |
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.pnpm && p.pnpm.patchedDependencies) {
            delete p.pnpm.patchedDependencies;
          }
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          rm -f pnpm-lock.yaml

      - name: Install dependencies
        env:
          CI: true
        run: |
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set fetch-retries 5
          pnpm config set fetch-retry-factor 2
          pnpm config set fetch-retry-mintimeout 10000
          pnpm config set fetch-retry-maxtimeout 120000
          pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Install Capacitor
        run: |
          pnpm add -D @capacitor/cli @capacitor/core @capacitor/android

      - name: Build web app
        run: pnpm build

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.antonservice.pos',
            appName: 'Anton Service POS',
            webDir: 'dist/public',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anton-Service-POS-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
