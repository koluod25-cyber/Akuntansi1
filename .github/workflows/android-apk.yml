name: Build Anton Service POS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Akuntansi1
        uses: actions/checkout@v4

      - name: Checkout recovered Anton source
        uses: actions/checkout@v4
        with:
          repository: koluod25-cyber/Anton
          ref: main
          path: _anton_source
          fetch-depth: 1

      - name: Restore application source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf client server shared attached_assets
          mkdir -p client/src/pages client/src
          cp _anton_source/Home.tsx client/src/pages/Home.tsx
          cp _anton_source/index.css client/src/index.css
          cp _anton_source/package.json ./package.json
          cp _anton_source/tsconfig.json ./tsconfig.json
          cp _anton_source/tsconfig.node.json ./tsconfig.node.json

          # Use exactly one pnpm installation in CI.
          npm pkg delete packageManager
          npm pkg delete pnpm
          npm pkg delete devDependencies.pnpm

          # Recreate the lockfile because the recovered source references
          # a patch file that is not present in the source checkout.
          rm -f pnpm-lock.yaml

          cat > client/src/App.tsx <<'EOF'
          import Home from "./pages/Home";

          export default function App() {
            return <Home />;
          }
          EOF

          cat > client/src/main.tsx <<'EOF'
          import React from "react";
          import ReactDOM from "react-dom/client";
          import App from "./App";
          import "./index.css";

          ReactDOM.createRoot(document.getElementById("root")!).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>
          );
          EOF

          cat > client/index.html <<'EOF'
          <!doctype html>
          <html lang="id">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
              <meta name="theme-color" content="#19202a" />
              <title>Anton Service POS</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          EOF

          cat > vite.config.ts <<'EOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import tailwindcss from "@tailwindcss/vite";
          import path from "node:path";

          export default defineConfig({
            plugins: [react(), tailwindcss()],
            resolve: {
              alias: {
                "@": path.resolve(process.cwd(), "client/src"),
              },
            },
            root: path.resolve(process.cwd(), "client"),
            build: {
              outDir: path.resolve(process.cwd(), "dist/public"),
              emptyOutDir: true,
            },
          });
          EOF

          rm -f pnpm-workspace.yaml
          npm pkg set scripts.build="vite build"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tool versions
        run: |
          node --version
          pnpm --version
          node -e "const p=require('./package.json'); console.log('packageManager=',p.packageManager||'none'); console.log('pnpmDependency=',p.devDependencies?.pnpm||'none')"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Install Capacitor
        run: pnpm add @capacitor/core @capacitor/android && pnpm add -D @capacitor/cli

      - name: Build web application
        run: pnpm build

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";

          const config: CapacitorConfig = {
            appId: "com.antonservice.pos",
            appName: "Anton Service POS",
            webDir: "dist/public"
          };

          export default config;
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        run: pnpm exec cap add android

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Verify Android project
        working-directory: android
        run: |
          test -f gradlew
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anton-Service-POS-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
