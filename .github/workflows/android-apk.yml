name: Build Anton Service POS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify tools
        run: |
          node --version
          pnpm --version

      - name: Prepare dependencies
        run: |
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.pnpm && p.pnpm.patchedDependencies) {
            delete p.pnpm.patchedDependencies;
          }
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n');
          "
          rm -f pnpm-lock.yaml

      - name: Install dependencies
        env:
          CI: true
        run: |
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set
